version: "3.9"

# Development override — hot reload for server and client
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# CRA dev server runs on :3000 and proxies /api → server:5000
# via the "proxy" field in client/package.json.

services:

  # Expose Mongo locally for GUI tools (Compass, Studio 3T, etc.)
  mongo:
    ports:
      - "27017:27017"

  # Nodemon hot-reload for Express
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: npx nodemon index.js
    volumes:
      - ./server:/app                # mount source
      - server_node_modules:/app/node_modules  # preserve installed modules
    environment:
      NODE_ENV: development
    ports:
      - "5000:5000"                  # expose for direct curl / Postman access

  # CRA dev server with hot reload
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    # No extra env needed — package.json "proxy": "http://server:5000"
    # routes /api calls from the CRA dev server to Express

volumes:
  server_node_modules:
  client_node_modules:
